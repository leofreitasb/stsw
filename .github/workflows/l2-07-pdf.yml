name: Build L2-07 PDF (temporary)
on:
  push:
    branches: [l2-07-mapping-leonardo]
    paths: [.github/workflows/l2-07-pdf.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - name: Create PDF
        run: python readings/07-mapping/gerar_resumo.py
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readings/07-mapping/leonardo-freitas.pdf
          git commit -m "L2-07: add digital handwritten-style reading summary"
          git push
